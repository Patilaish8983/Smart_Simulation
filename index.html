<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSpace Studio – Spatial AR Simulator</title>
  <style>
    :root { --primary: #2A7BDE; --danger: #ef4444; --bg-ui: #ffffff; --text: #1e293b; }
    body { display: flex; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; color: var(--text); height: 100vh; overflow: hidden; }
    
    #sidebar { width: 320px; background: var(--bg-ui); padding: 25px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 20px; box-shadow: 4px 0 15px rgba(0,0,0,0.02); z-index: 10; overflow-y: auto; }
    h3 { margin: 0 0 5px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
    
    .btn { width: 100%; padding: 12px; border: none; cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-cam { background: #0f172a; color: white; }
    .btn-cam:hover { background: #334155; }
    .btn-add { background: #eff6ff; color: var(--primary); border: 1px dashed var(--primary); margin-bottom: 8px; text-align: left; justify-content: flex-start; }
    .btn-add:hover { background: var(--primary); color: white; }
    
    .config-panel { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
    .input-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .input-group label { font-size: 13px; font-weight: 500; color: #475569; }
    .input-group input { width: 80px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; font-weight: 600; }

    #canvas-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 30px; background: #e2e8f0; }
    .viewport-wrapper { position: relative; width: 850px; height: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
    canvas { position: absolute; top: 0; left: 0; background: #ffffff; cursor: move; }
    
    .instruction-tip { font-size: 12px; color: #64748b; line-height: 1.4; text-align: center; margin-top: auto; padding: 10px; background: #f8fafc; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div>
      <h3>System Environment</h3>
      <button class="btn btn-cam" onclick="toggleCamera()">📷 Toggle Live AR Camera</button>
    </div>

    <div>
      <h3>Furniture Blueprint Library</h3>
      <button class="btn btn-add" onclick="addFurniture('sofa')">🛋️ Add Luxury Sofa</button>
      <button class="btn btn-add" onclick="addFurniture('table')">🪑 Add Dining Table</button>
      <button class="btn btn-add" onclick="addFurniture('bed')">🛏️ Add Queen Bed</button>
    </div>

    <div class="config-panel">
      <h3>Precision Dimension Tuning</h3>
      <p style="font-size: 12px; color:#64748b; margin:0;">Select an object on the canvas to edit its scale parameters:</p>
      <div class="input-group">
        <label>Width (cm):</label>
        <input type="number" id="cfgWidth" min="20" max="500" oninput="updateSelectedDimension()" disabled>
      </div>
      <div class="input-group">
        <label>Depth (cm):</label>
        <input type="number" id="cfgHeight" min="20" max="500" oninput="updateSelectedDimension()" disabled>
      </div>
    </div>

    <div class="instruction-tip">
      💡 <strong>Architectural scale:</strong> 100 pixels = 100 centimeters (1 Meter). Select items to highlight engineering clearance vectors.
    </div>
  </div>

  <div id="canvas-container">
    <div class="viewport-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="simCanvas" width="850" height="600"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
